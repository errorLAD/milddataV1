{% extends 'base.html' %}

{% block title %}Add Tenant | PropFlow SaaS{% endblock %}

{% block content %}
<div class="kp-header-row">
  <div>
    <h1 class="kp-page-title">Register New Tenant</h1>
    <p class="kp-page-subtitle">Create tenant profile and credentials for PWA mobile access.</p>
  </div>
</div>

<div class="kp-panel" style="max-width: 700px;">
  <div class="kp-panel-header">
    <h3 class="kp-panel-title">Tenant Information</h3>
  </div>
  <div class="p-3">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">First Name *</label>
          <input type="text" name="first_name" class="form-control form-control-sm" required placeholder="Alex">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Last Name *</label>
          <input type="text" name="last_name" class="form-control form-control-sm" required placeholder="Morgan">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Email Address *</label>
          <input type="email" name="email" class="form-control form-control-sm" required placeholder="alex.morgan@gmail.com">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Phone Number *</label>
          <input type="text" name="phone" class="form-control form-control-sm" required placeholder="+1 (512) 555-0199">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Emergency Contact Name</label>
          <input type="text" name="emergency_name" class="form-control form-control-sm" placeholder="Sarah Morgan">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Emergency Contact Phone</label>
          <input type="text" name="emergency_phone" class="form-control form-control-sm" placeholder="+1 (512) 555-0122">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'tenant_list' %}" class="kp-btn kp-btn-secondary">Cancel</a>
        <button type="submit" class="kp-btn kp-btn-primary">Register Tenant</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
