{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | PropFlow SaaS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/karobarplus.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background-color: var(--bg);">

  <div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
      <div class="bg-primary text-white fw-bold rounded-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 44px; height: 44px; font-size: 1.2rem; background-color: var(--brand) !important;">PF</div>
      <h3 class="fw-bold text-dark mb-1">Sign in to PropFlow</h3>
      <p class="text-secondary fs-7">Enter your credentials or click a demo account below</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 px-3 fs-7 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
    </div>
    {% endif %}

    <div class="kp-card p-4 mb-3">
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold fs-7 text-dark">Username or Email</label>
          <input type="text" id="usernameInput" name="username" class="form-control form-control-sm" required placeholder="manager@propflow.com">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold fs-7 text-dark">Password</label>
          <input type="password" id="passwordInput" name="password" class="form-control form-control-sm" required value="PropFlow2026!">
        </div>
        <button type="submit" class="kp-btn kp-btn-primary w-100 py-2 fs-7 mb-2">Sign In</button>
      </form>

      <div class="text-center my-2 text-muted fs-8">— OR —</div>

      <!-- Guest Login Button -->
      <a href="{% url 'guest_login' %}" class="kp-btn kp-btn-secondary w-100 py-2 fs-7 text-decoration-none">
        <i class="bi bi-person-bounding-box me-1 text-primary"></i> Continue as Guest
      </a>
    </div>

    <!-- Demo Role Auto-Login Shortcuts -->
    <div class="kp-card p-3 text-center">
      <div class="fw-semibold text-secondary mb-2" style="font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase;">Quick Demo Role Accounts</div>
      <div class="d-flex flex-wrap gap-1.5 justify-content-center">
        <button onclick="fillDemo('manager@propflow.com', 'PropFlow2026!')" class="kp-btn kp-btn-secondary fs-8 py-1 px-2">Manager</button>
        <button onclick="fillDemo('owner@propflow.com', 'PropFlow2026!')" class="kp-btn kp-btn-secondary fs-8 py-1 px-2">Owner</button>
        <button onclick="fillDemo('accountant@propflow.com', 'PropFlow2026!')" class="kp-btn kp-btn-secondary fs-8 py-1 px-2">Accountant</button>
        <button onclick="fillDemo('tech@propflow.com', 'PropFlow2026!')" class="kp-btn kp-btn-secondary fs-8 py-1 px-2">Maintenance</button>
        <button onclick="fillDemo('tenant@propflow.com', 'PropFlow2026!')" class="kp-btn kp-btn-secondary fs-8 py-1 px-2">Tenant PWA</button>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(user, pass) {
      document.getElementById('usernameInput').value = user;
      document.getElementById('passwordInput').value = pass;
    }
  </script>
</body>
</html>
