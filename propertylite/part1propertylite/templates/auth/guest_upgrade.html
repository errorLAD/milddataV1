{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgrade Guest Account | PropFlow SaaS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/karobarplus.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background-color: var(--bg);">

  <div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
      <div class="bg-primary text-white fw-bold rounded-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 44px; height: 44px; font-size: 1.2rem; background-color: var(--brand) !important;">PF</div>
      <h3 class="fw-bold text-dark mb-1">Upgrade to Full Account</h3>
      <p class="text-secondary fs-7">Convert your Guest session into a permanent Property Manager organization</p>
    </div>

    <div class="kp-card p-4 mb-4">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold fs-7 text-dark">Organization / Portfolio Name *</label>
          <input type="text" name="org_name" class="form-control form-control-sm" required placeholder="e.g. Apex Property Management">
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold fs-7 text-dark">First Name *</label>
            <input type="text" name="first_name" class="form-control form-control-sm" required placeholder="Jane">
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold fs-7 text-dark">Last Name *</label>
            <input type="text" name="last_name" class="form-control form-control-sm" required placeholder="Doe">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold fs-7 text-dark">Email Address *</label>
          <input type="email" name="email" class="form-control form-control-sm" required placeholder="jane.doe@apexprop.com">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold fs-7 text-dark">Set Account Password *</label>
          <input type="password" name="password" class="form-control form-control-sm" required placeholder="Create a secure password">
        </div>

        <button type="submit" class="kp-btn kp-btn-primary w-100 py-2 fs-7">Upgrade Account & Create Portfolio</button>
      </form>
    </div>

    <div class="text-center">
      <a href="{% url 'dashboard' %}" class="text-secondary text-decoration-none fs-7"><i class="bi bi-arrow-left"></i> Return to Guest Mode</a>
    </div>
  </div>

</body>
</html>
