{% extends 'base.html' %}

{% block title %}Add Unit to {{ property.name }} | PropFlow SaaS{% endblock %}

{% block content %}
<div class="kp-header-row">
  <div>
    <h1 class="kp-page-title">Add Unit to {{ property.name }}</h1>
    <p class="kp-page-subtitle">Configure unit number, layout specs, and base monthly rental terms.</p>
  </div>
</div>

<div class="kp-panel" style="max-width: 700px;">
  <div class="kp-panel-header">
    <h3 class="kp-panel-title">Unit Configuration</h3>
  </div>
  <div class="p-3">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Unit Number / Suite *</label>
          <input type="text" name="unit_number" class="form-control form-control-sm" required placeholder="e.g. A-204 or Suite 300">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Floor Level *</label>
          <input type="number" name="floor" class="form-control form-control-sm" value="2" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold fs-7">Unit Layout Type *</label>
          <select name="type" class="form-select form-select-sm" required>
            {% for code, label in unit_types %}
            <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold fs-7">Area (Sq Ft) *</label>
          <input type="number" name="area_sqft" class="form-control form-control-sm" value="850" required>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold fs-7">Beds</label>
          <input type="number" name="bedrooms" class="form-control form-control-sm" value="2">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold fs-7">Baths</label>
          <input type="number" step="0.5" name="bathrooms" class="form-control form-control-sm" value="2">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Target Monthly Rent ($) *</label>
          <input type="number" step="0.01" name="monthly_rent" class="form-control form-control-sm" value="1650.00" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Required Security Deposit ($) *</label>
          <input type="number" step="0.01" name="security_deposit" class="form-control form-control-sm" value="1650.00" required>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'property_detail' pk=property.id %}" class="kp-btn kp-btn-secondary">Cancel</a>
        <button type="submit" class="kp-btn kp-btn-primary">Save Unit</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
