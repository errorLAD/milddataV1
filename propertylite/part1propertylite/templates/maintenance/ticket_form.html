{% extends 'base.html' %}

{% block title %}Create Ticket | PropFlow SaaS{% endblock %}

{% block content %}
<div class="kp-header-row">
  <div>
    <h1 class="kp-page-title">Submit Maintenance Request</h1>
    <p class="kp-page-subtitle">Report a maintenance or repair issue for a property unit.</p>
  </div>
</div>

<div class="kp-panel" style="max-width: 700px;">
  <div class="kp-panel-header">
    <h3 class="kp-panel-title">Work Order Details</h3>
  </div>
  <div class="p-3">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold fs-7">Issue Title *</label>
        <input type="text" name="title" class="form-control form-control-sm" required placeholder="e.g. Water leakage in master bathroom sink">
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Select Unit *</label>
          <select name="unit" class="form-select form-select-sm" required>
            {% for u in units %}
            <option value="{{ u.id }}">{{ u.property.name }} — Unit {{ u.unit_number }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Select Tenant *</label>
          <select name="tenant" class="form-select form-select-sm" required>
            {% for t in tenants %}
            <option value="{{ t.id }}">{{ t.get_full_name }} ({{ t.email }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Category *</label>
          <select name="category" class="form-select form-select-sm" required>
            {% for code, label in categories %}
            <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Priority Level *</label>
          <select name="priority" class="form-select form-select-sm" required>
            {% for code, label in priorities %}
            <option value="{{ code }}" {% if code == 'MEDIUM' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold fs-7">Full Description *</label>
        <textarea name="description" class="form-control form-control-sm" rows="3" required placeholder="Describe what happened, location, severity..."></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'ticket_list' %}" class="kp-btn kp-btn-secondary">Cancel</a>
        <button type="submit" class="kp-btn kp-btn-primary">Submit Work Order</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
