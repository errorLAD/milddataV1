{% extends 'base.html' %}

{% block title %}Create Lease | PropFlow SaaS{% endblock %}

{% block content %}
<div class="kp-header-row">
  <div>
    <h1 class="kp-page-title">Create Lease Contract</h1>
    <p class="kp-page-subtitle">Assign a tenant to an available unit and specify rent terms.</p>
  </div>
</div>

<div class="kp-panel" style="max-width: 750px;">
  <div class="kp-panel-header">
    <h3 class="kp-panel-title">Contract Details</h3>
  </div>
  <div class="p-3">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Select Available Unit *</label>
          <select name="unit" class="form-select form-select-sm" required>
            {% for u in units %}
            <option value="{{ u.id }}">{{ u.property.name }} — Unit {{ u.unit_number }} (${{ u.monthly_rent }}/mo)</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Select Tenant *</label>
          <select name="tenant" class="form-select form-select-sm" required>
            {% for t in tenants %}
            <option value="{{ t.id }}">{{ t.get_full_name }} ({{ t.email }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Lease Start Date *</label>
          <input type="date" name="start_date" class="form-control form-control-sm" required value="2026-09-01">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Lease End Date *</label>
          <input type="date" name="end_date" class="form-control form-control-sm" required value="2027-08-31">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Agreed Monthly Rent ($) *</label>
          <input type="number" step="0.01" name="monthly_rent" class="form-control form-control-sm" required value="1650.00">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold fs-7">Security Deposit Collected ($) *</label>
          <input type="number" step="0.01" name="security_deposit" class="form-control form-control-sm" required value="1650.00">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'lease_list' %}" class="kp-btn kp-btn-secondary">Cancel</a>
        <button type="submit" class="kp-btn kp-btn-primary">Generate & Activate Lease</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
