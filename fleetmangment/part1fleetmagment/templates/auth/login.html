{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Fleet Operating System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/karobarplus.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background-color: var(--bg);">

  <div class="card kp-panel shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <div class="btn-kp-primary d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width: 42px; height: 42px; border-radius: 12px;">
        <i class="fa-solid fa-truck-fast text-white" style="font-size: 1.2rem;"></i>
      </div>
      <h1 class="page-title mt-1 mb-1">Fleet Operating System</h1>
      <p class="page-subtitle">Light Enterprise SaaS Fleet Management</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 px-3 mb-3" style="font-size: 0.72rem; border-radius: 8px;">
      <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-secondary fw-semibold" style="font-size: 0.7rem;">USERNAME OR EMAIL</label>
        <input type="text" name="username" class="form-control form-control-kp" required autofocus placeholder="admin / driver1">
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary fw-semibold" style="font-size: 0.7rem;">PASSWORD</label>
        <input type="password" name="password" class="form-control form-control-kp" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-kp btn-kp-primary w-100 py-2 mb-3" style="font-size: 0.8rem;">
        Sign In to Platform <i class="fa-solid fa-arrow-right ms-1"></i>
      </button>
    </form>

    <div class="position-relative my-3 text-center">
      <hr style="border-color: var(--border);">
      <span class="position-absolute top-50 start-50 translate-middle px-2 bg-white text-muted" style="font-size: 0.65rem;">OR</span>
    </div>

    <a href="{% url 'guest_login' %}" class="btn-kp btn-kp-secondary w-100 py-2 text-decoration-none text-center d-block mb-2" style="font-size: 0.8rem;">
      <i class="fa-solid fa-user-clock me-1 text-primary"></i> Continue as Guest (Public Demo)
    </a>


    <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border);">
      <p class="text-muted mb-0" style="font-size: 0.68rem;">Demo Admin: <code>admin</code> / <code>admin123</code></p>
      <p class="text-muted mb-0" style="font-size: 0.68rem;">Demo Driver: <code>driver1</code> / <code>driver123</code></p>
    </div>
  </div>

</body>
</html>
