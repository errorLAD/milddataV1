<!-- Global Search Modal (Ctrl + K) -->
<div class="kp-modal-backdrop" id="modal-global-search">
  <div class="kp-modal" style="max-width: 600px;">
    <div class="kp-modal-header" style="background: #FFFFFF;">
      <div style="display: flex; align-items: center; gap: 0.6rem; width: 100%;">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--brand); font-size: 0.9rem;"></i>
        <input type="text" id="global-search-input" class="kp-input" placeholder="Search machines, documents, refuels, maintenance, clients... (Press ESC to exit)" style="border: none; box-shadow: none; font-size: 0.85rem;" autofocus>
      </div>
      <button class="kp-icon-btn" data-modal-close><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div id="global-search-results" style="max-height: 380px; overflow-y: auto; padding: 0.5rem 0.75rem; background: var(--surface-alt);">
      <div style="text-align: center; color: var(--text-tertiary); padding: 2rem; font-size: 0.72rem;">
        Type 2 or more characters to search across equipment, permits, refuel logs, and invoices...
      </div>
    </div>
    
    <div class="kp-modal-footer" style="justify-content: space-between; font-size: 0.64rem; color: var(--text-tertiary);">
      <span><kbd style="background: var(--border); padding: 0.1rem 0.3rem; border-radius: 4px;">Ctrl + K</kbd> or <kbd style="background: var(--border); padding: 0.1rem 0.3rem; border-radius: 4px;">/</kbd> to open anytime</span>
      <span>Strict Multi-Tenant Permission Filtered</span>
    </div>
  </div>
</div>
