{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Milda Data Enterprise CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-brand img {
            height: 42px;
            width: auto;
            margin-bottom: 0.75rem;
        }
        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        .form-control {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .form-control:focus {
            border-color: #3b82f6;
        }

        .btn-login {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: #1d4ed8;
        }

        .alert {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .alert-error, .alert-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fecaca;
            border: 1px solid #dc2626;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #a7f3d0;
            border: 1px solid #059669;
        }
        .alert-info {
            background: rgba(59, 130, 246, 0.2);
            color: #bfdbfe;
            border: 1px solid #2563eb;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.82rem;
            color: #64748b;
        }
        .login-footer a {
            color: #38bdf8;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">
            <img src="{{ cms_settings.logo_url|default:'https://i.postimg.cc/43gxKLrL/6e2fd4bb-c219-46d7-a5a3-21d4df5b9461.png' }}" alt="Milda Data">
            <h1 class="login-title">Admin CMS Portal</h1>
            <p class="login-subtitle">Authorized Administrator Access Only</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'website_cms:admin_login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'/admin/dashboard/' }}">

            <div class="form-group">
                <label class="form-label" for="username">Admin Username or Email</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="admin or admin@mildadata.com" value="{{ username_val|default:'' }}" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn-login">Sign In to Admin Panel &rarr;</button>
        </form>

        <div class="login-footer">
            <p>&larr; Return to <a href="/">Milda Data Main Website</a></p>
        </div>
    </div>

</body>
</html>
