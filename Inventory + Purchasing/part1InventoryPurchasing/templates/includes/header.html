{% load locale_tags %}
<header class="app-header">
  <div class="header-left">
    <!-- Hamburger Button for Mobile Drawer -->
    <button onclick="toggleMobileDrawer()" class="mobile-menu-btn" aria-label="Open Navigation Menu">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <!-- Global Search Bar -->
    <div class="header-search">
      <svg class="header-search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="global-search-input" placeholder="Search... (Ctrl+K)">
      <div id="global-search-results" class="search-results-dropdown"></div>
    </div>
  </div>

  <div class="header-actions">
    <!-- StockFlow AI Copilot Trigger Button -->
    <button onclick="toggleAICopilotDrawer()" class="btn btn-secondary btn-sm" style="color: var(--brand); border-color: var(--brand-soft-border); background: var(--brand-soft);" title="StockFlow AI Copilot">
      🤖 <span class="d-none d-sm-inline">StockFlow AI</span>
    </button>

    {% if request.is_guest %}
      <div style="background: var(--warning-soft); border: 1px solid var(--warning-border); color: var(--warning); padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.62rem; font-weight: 700; display: flex; align-items: center; gap: 0.3rem;">
        <span>⚡ Guest Mode</span>
        <a href="{% url 'register' %}" class="btn btn-primary btn-sm" style="font-size: 0.58rem; padding: 0.15rem 0.4rem; height: auto;">Upgrade Account</a>
      </div>
    {% endif %}

    <!-- Camera Barcode Scanner Button -->
    <button onclick="openBarcodeScannerModal()" class="btn btn-secondary btn-sm" title="Scan Barcode via Camera">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v1m6-1v1M6 4v1m12 15v1M6 20v1m12-11V7a2 2 0 00-2-2H8a2 2 0 00-2 2v3m12 3v3a2 2 0 01-2 2H8a2 2 0 01-2-2v-3"/></svg>
      <span class="d-none d-sm-inline">Scan Barcode</span>
    </button>

    <!-- Seed Demo Data Quick Trigger Button -->
    <a href="{% url 'seed_demo_data' %}" class="btn btn-secondary btn-sm" style="color: var(--brand); border-color: var(--brand-soft-border); background: var(--brand-soft);" title="Seed Realistic Demo Data">
      ⚡ <span class="d-none d-md-inline">Seed Demo</span>
    </a>

    <!-- Notifications Button -->
    <button class="btn-icon" title="Notifications">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      {% if unread_notifications_count > 0 %}
        <span class="badge-dot"></span>
      {% endif %}
    </button>

    <!-- User Profile Dropdown -->
    <div style="display: flex; align-items: center; gap: 0.4rem;">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1px solid var(--brand-soft-border); font-size: 0.8rem;">
        {{ request.user.first_name|default:request.user.username|slice:":1"|upper }}
      </div>
    </div>
  </div>
</header>
