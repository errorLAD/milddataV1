{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Onboarding Portal - SupplierOS</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <style>
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; }
    .portal-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<header class="portal-nav">
  <div style="display: flex; align-items: center; gap: 0.5rem;">
    <div style="width: 24px; height: 24px; background: var(--brand); border-radius: var(--radius-md); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem;">S</div>
    <span style="font-size: 0.9rem; font-weight: 700; color: var(--text-primary);">SupplierOS Portal</span>
  </div>
  <span class="status-pill pill-info font-tabular" style="font-size: 0.62rem;">Secure Vendor Access</span>
</header>

<main class="portal-container">
  {% if messages %}
    {% for message in messages %}
      <div class="status-pill pill-{% if message.tags == 'error' %}rejected{% else %}approved{% endif %}" style="padding: 0.6rem 0.8rem; width: 100%; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; border-radius: var(--radius-md);">
        <span class="dot"></span> {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</main>

</body>
</html>
