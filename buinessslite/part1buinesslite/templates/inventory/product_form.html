{% extends 'base.html' %}

{% block title %}Add Product - BusinessLite{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Add New Product</h1>
        <div class="page-subtitle">Create product item or service</div>
    </div>
</div>

<div class="card-panel" style="max-width: 600px;">
    <div class="panel-header">
        <div class="panel-title">Product Information</div>
    </div>
    <div class="panel-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-input" placeholder="e.g. Wireless Router X" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">SKU</label>
                    <input type="text" name="sku" class="form-input" placeholder="e.g. ROUTER-X-01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Barcode / QR Code</label>
                    <input type="text" name="barcode" class="form-input" placeholder="e.g. 890123456789">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Product Type</label>
                    <select name="product_type" class="form-select">
                        <option value="PHYSICAL">Physical Stock</option>
                        <option value="SERVICE">Service</option>
                        <option value="NON_STOCK">Non-Stock Item</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Unit of Measure</label>
                    <input type="text" name="unit" class="form-input" value="pcs" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Purchase Price (Cost)</label>
                    <input type="number" step="0.01" name="purchase_price" class="form-input" value="0.00" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Selling Price</label>
                    <input type="number" step="0.01" name="selling_price" class="form-input" value="0.00" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Initial Stock Quantity</label>
                    <input type="number" name="stock_quantity" class="form-input" value="0" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Reorder Level Threshold</label>
                    <input type="number" name="reorder_level" class="form-input" value="5" required>
                </div>
            </div>

            <button type="submit" class="btn-saas btn-primary" style="margin-top: 0.5rem;">Save Product</button>
        </form>
    </div>
</div>
{% endblock %}
