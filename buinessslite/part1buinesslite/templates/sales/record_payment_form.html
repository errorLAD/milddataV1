{% extends 'base.html' %}

{% block title %}Record Payment - {{ inv.invoice_number }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Record Payment: {{ inv.invoice_number }}</h1>
        <div class="page-subtitle">Remaining Balance: {{ currency_symbol }}{{ inv.remaining_amount|floatformat:2 }}</div>
    </div>
</div>

<div class="card-panel" style="max-width: 500px;">
    <div class="panel-header">
        <div class="panel-title">Payment Information</div>
    </div>
    <div class="panel-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Payment Amount</label>
                <input type="number" step="0.01" name="amount" class="form-input" value="{{ inv.remaining_amount }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select name="payment_method" class="form-select">
                    {% for val, label in methods %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Transaction Reference / Check #</label>
                <input type="text" name="reference" class="form-input" placeholder="e.g. TR-990812">
            </div>

            <div class="form-group">
                <label class="form-label">Payment Date</label>
                <input type="date" name="date" class="form-input" required>
            </div>

            <button type="submit" class="btn-saas btn-primary">Save Payment</button>
        </form>
    </div>
</div>
{% endblock %}
