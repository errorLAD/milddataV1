{% extends 'base.html' %}

{% block title %}Add Employee - BusinessLite{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Add Employee</h1>
        <div class="page-subtitle">Register new staff member</div>
    </div>
</div>

<div class="card-panel" style="max-width: 550px;">
    <div class="panel-header">
        <div class="panel-title">Employee Details</div>
    </div>
    <div class="panel-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-input" placeholder="e.g. Alex Morgan" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="job_title" class="form-input" placeholder="e.g. Sales Associate" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" class="form-input" placeholder="e.g. Retail Sales">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="alex@company.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-input" placeholder="+1 555 0122">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Basic Salary Record</label>
                    <input type="number" step="0.01" name="basic_salary" class="form-input" value="3500.00" required>
                </div>
            </div>

            <button type="submit" class="btn-saas btn-primary">Save Employee</button>
        </form>
    </div>
</div>
{% endblock %}
