{% extends 'base.html' %}

{% block title %}Request Leave - BusinessLite{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Submit Leave Request</h1>
        <div class="page-subtitle">Request leave for employee</div>
    </div>
</div>

<div class="card-panel" style="max-width: 500px;">
    <div class="panel-header">
        <div class="panel-title">Leave Details</div>
    </div>
    <div class="panel-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Employee</label>
                <select name="employee_id" class="form-select" required>
                    <option value="">Select Employee</option>
                    {% for e in employees %}
                    <option value="{{ e.id }}">{{ e.name }} ({{ e.job_title }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Leave Type</label>
                <select name="leave_type" class="form-select">
                    <option value="ANNUAL">Annual Leave</option>
                    <option value="SICK">Sick Leave</option>
                    <option value="CASUAL">Casual Leave</option>
                    <option value="UNPAID">Unpaid Leave</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Reason</label>
                <textarea name="reason" class="form-textarea" rows="3" placeholder="Reason for leave..." required></textarea>
            </div>

            <button type="submit" class="btn-saas btn-primary">Submit Leave Request</button>
        </form>
    </div>
</div>
{% endblock %}
