{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MildData BusinessLite</title>
    <link rel="stylesheet" href="{% static 'css/karobar.css' %}">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">

<div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 400px; padding: 2rem; box-shadow: var(--shadow-xs);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 1.3rem; font-weight: 700; color: var(--text-primary);">MildData BusinessLite</div>
        <div style="font-size: 0.72rem; color: var(--text-secondary); margin-top: 0.2rem;">Simple Operating System for Small Business</div>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-input" value="admin@businesslite.com" required>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" value="demo123" required>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
            <button type="submit" class="btn-saas btn-primary" style="flex: 1; min-height: 40px;">Log In</button>
            <a href="{% url 'guest_login' %}" class="btn-saas btn-secondary" style="flex: 1; min-height: 40px; text-decoration: none;">👤 Continue as Guest</a>
        </div>
    </form>

    <div style="margin-top: 1.25rem; padding: 0.75rem; background: var(--brand-soft); border: 1px solid var(--brand-soft-border); border-radius: var(--radius-sm); font-size: 0.65rem; color: var(--brand-dark);">
        💡 <strong>Quick Access Options:</strong><br>
        • <strong>Admin Demo:</strong> <code>admin@businesslite.com</code> / <code>demo123</code><br>
        • <strong>Guest Mode:</strong> Click "Continue as Guest" for instant read-only exploration.
    </div>
</div>

</body>
</html>
