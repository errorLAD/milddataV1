{% extends "base.html" %}

{% block title %}{{ title }} | KarobarPlus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card card-custom p-4 border-0 shadow-sm">
            <h4 class="fw-bold text-dark mb-3 pb-2 border-bottom">{{ title }}</h4>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7">Supplier Full Name *</label>
                    {{ form.supplier_name }}
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold fs-7">Phone Number *</label>
                        {{ form.phone }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold fs-7">Company / Business Name</label>
                        {{ form.business_name }}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7">Supplier Address</label>
                    {{ form.address }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold fs-7">Notes / Remarks</label>
                    {{ form.notes }}
                </div>

                <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top">
                    <a href="{% url 'suppliers:list' %}" class="btn btn-light border btn-sm">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom btn-sm">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
