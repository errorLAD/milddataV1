{% extends "base.html" %}

{% block title %}Create Broadcast Campaign | KarobarPlus{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-7">
        <div class="card card-custom p-4 shadow-sm border-0">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                <h4 class="fw-bold text-dark mb-0"><i class="bi bi-megaphone me-2 text-primary"></i> Create Broadcast Campaign</h4>
                <a href="{% url 'whatsapp:campaign_list' %}" class="btn btn-sm btn-outline-secondary">Cancel</a>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7">Campaign Title *</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Diwali Special Offer 20% Off" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7">Target Audience / Segment *</label>
                    <select name="target_type" id="targetType" class="form-select" required>
                        <option value="all">All Opted-in Marketing Customers</option>
                        <option value="tag">Specific Customer Tag / Segment</option>
                        <option value="selected">Manually Pick Customers</option>
                    </select>
                </div>

                <div class="mb-3" id="tagSelectContainer" style="display: none;">
                    <label class="form-label fw-semibold fs-7">Select Target Tag</label>
                    <select name="target_tag" class="form-select">
                        <option value="">Select Tag...</option>
                        {% for tag in tags %}
                        <option value="{{ tag.id }}">{{ tag.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3" id="customerSelectContainer" style="display: none;">
                    <label class="form-label fw-semibold fs-7">Select Target Customers</label>
                    <select name="selected_customers" class="form-select" multiple size="5">
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }} ({{ c.phone }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7">Campaign Message Text *</label>
                    <textarea name="message_text" class="form-control" rows="4" placeholder="Namaste {{customer_name}}, humare store par Diwali discount offer start ho chuka hai..." required></textarea>
                    <small class="text-muted fs-8">Use <code>{{customer_name}}</code> for dynamic customer name insertion.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold fs-7">Optional Campaign Image / Banner</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom flex-grow-1 py-2 fs-6">
                        <i class="bi bi-send-fill me-2"></i> Launch & Send Broadcast
                    </button>
                    <a href="{% url 'whatsapp:campaign_list' %}" class="btn btn-light border py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const targetType = document.getElementById("targetType");
    const tagSelectContainer = document.getElementById("tagSelectContainer");
    const customerSelectContainer = document.getElementById("customerSelectContainer");

    targetType.addEventListener("change", function() {
        if (this.value === "tag") {
            tagSelectContainer.style.display = "block";
            customerSelectContainer.style.display = "none";
        } else if (this.value === "selected") {
            tagSelectContainer.style.display = "none";
            customerSelectContainer.style.display = "block";
        } else {
            tagSelectContainer.style.display = "none";
            customerSelectContainer.style.display = "none";
        }
    });
});
</script>
{% endblock %}
