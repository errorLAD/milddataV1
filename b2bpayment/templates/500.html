{% extends "base.html" %}

{% block title %}500 Server Error | NextSlot{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5 text-center">
    <div class="col-12 col-md-6">
        <div class="kp-card p-5">
            <div class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-1 rounded-pill mb-3">
                <i class="bi bi-bug-fill me-1"></i> System Error (500)
            </div>
            <h2 class="fw-bold text-dark mb-2">Something Went Wrong</h2>
            <p class="text-secondary fs-7 mb-4">An unexpected error occurred. Our team has been notified and is looking into it.</p>
            <a href="{% url 'dashboard:index' %}" class="btn-kp-primary">
                <i class="bi bi-house-fill me-1"></i> Back to Safety
            </a>
        </div>
    </div>
</div>
{% endblock %}
