{% extends "base.html" %}

{% block title %}Delete Promotion | KarobarPlus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card card-custom p-4 border-0 shadow-sm text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
            <h4 class="fw-bold text-dark mb-2">Delete Promotion Campaign?</h4>
            <p class="text-muted fs-7 mb-4">
                Are you sure you want to delete promotion <strong>{{ promotion.name }}</strong>?
                This action cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex align-items-center justify-content-center gap-3">
                    <a href="{% url 'promotions:list' %}" class="btn btn-light border btn-sm px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger btn-sm px-4">Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
